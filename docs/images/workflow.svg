<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-labelledby="t d">
  <title id="t">How Dub Booth works</title>
  <desc id="d">Four steps: load your originals, record each cue while the original plays, build your dub from the best parts of your takes, and export files named like the originals.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d2d9e1; stroke-width: 1.5; }
    .n { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .h { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #121821; }
    .p { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #566173; }
    .arrow { fill: none; stroke: #9aa5b4; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0" y="0" width="960" height="270" rx="18" fill="#edf0f3"/>

  <!-- 1 load -->
  <rect class="card" x="20" y="24" width="210" height="222" rx="16"/>
  <circle cx="48" cy="52" r="15" fill="#121821"/><text class="n" x="48" y="57" text-anchor="middle">1</text>
  <g transform="translate(96 62)">
    <rect x="0" y="10" width="54" height="66" rx="7" fill="#e2e7ec" stroke="#566173" stroke-width="2"/>
    <rect x="10" y="0" width="54" height="66" rx="7" fill="#ffffff" stroke="#22708f" stroke-width="2.5"/>
    <path d="M20 40 v-4 M26 44 v-12 M32 48 v-20 M38 42 v-8 M44 46 v-16 M50 40 v-4" stroke="#22708f" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="h" x="36" y="172">Load originals</text>
  <text class="p" x="36" y="196">MP3 or WAV files, one per</text>
  <text class="p" x="36" y="215">cue, a .zip of them, or a</text>
  <text class="p" x="36" y="234">Dub Booth backup.</text>

  <path class="arrow" d="M236 135 h18 m-7 -7 l7 7 l-7 7"/>

  <!-- 2 record -->
  <rect class="card" x="262" y="24" width="210" height="222" rx="16"/>
  <circle cx="290" cy="52" r="15" fill="#121821"/><text class="n" x="290" y="57" text-anchor="middle">2</text>
  <g transform="translate(330 58)">
    <path d="M10 44 a30 30 0 0 1 60 0" fill="none" stroke="#566173" stroke-width="5" stroke-linecap="round"/>
    <rect x="2" y="40" width="14" height="26" rx="6" fill="#566173"/>
    <rect x="64" y="40" width="14" height="26" rx="6" fill="#566173"/>
    <circle cx="40" cy="62" r="19" fill="#d42a36"/><circle cx="40" cy="62" r="7" fill="#ffffff"/>
  </g>
  <text class="h" x="278" y="172">Record each cue</text>
  <text class="p" x="278" y="196">The original plays in your</text>
  <text class="p" x="278" y="215">headphones while you dub,</text>
  <text class="p" x="278" y="234">or first, then a beep.</text>

  <path class="arrow" d="M478 135 h18 m-7 -7 l7 7 l-7 7"/>

  <!-- 3 build -->
  <rect class="card" x="504" y="24" width="210" height="222" rx="16"/>
  <circle cx="532" cy="52" r="15" fill="#121821"/><text class="n" x="532" y="57" text-anchor="middle">3</text>
  <g transform="translate(560 50)">
    <rect x="0" y="0" width="100" height="14" rx="4" fill="#f3e3d1"/><rect x="0" y="0" width="44" height="14" rx="4" fill="#b25d05"/>
    <rect x="0" y="20" width="100" height="14" rx="4" fill="#f3e3d1"/><rect x="44" y="20" width="30" height="14" rx="4" fill="#b25d05"/>
    <rect x="0" y="40" width="100" height="14" rx="4" fill="#f3e3d1"/><rect x="74" y="40" width="26" height="14" rx="4" fill="#b25d05"/>
    <path d="M50 60 v10 m-6 -6 l6 6 l6 -6" stroke="#566173" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="76" width="44" height="16" rx="4" fill="#b25d05"/><rect x="45" y="76" width="29" height="16" rx="4" fill="#c97a22"/><rect x="75" y="76" width="25" height="16" rx="4" fill="#b25d05"/>
  </g>
  <text class="h" x="520" y="172">Build your dub</text>
  <text class="p" x="520" y="196">Every take is kept. Use</text>
  <text class="p" x="520" y="215">the best part of each and</text>
  <text class="p" x="520" y="234">line it up with the original.</text>

  <path class="arrow" d="M720 135 h18 m-7 -7 l7 7 l-7 7"/>

  <!-- 4 export -->
  <rect class="card" x="746" y="24" width="194" height="222" rx="16"/>
  <circle cx="774" cy="52" r="15" fill="#121821"/><text class="n" x="774" y="57" text-anchor="middle">4</text>
  <g transform="translate(806 58)">
    <path d="M38 0 v44 m-16 -16 l16 16 l16 -16" stroke="#1c7d45" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 48 v20 a6 6 0 0 0 6 6 h56 a6 6 0 0 0 6 -6 v-20" stroke="#121821" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <text class="h" x="762" y="172">Export</text>
  <text class="p" x="762" y="196">A zip of your dubs, each</text>
  <text class="p" x="762" y="215">named and encoded like</text>
  <text class="p" x="762" y="234">its original.</text>
</svg>
