<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">The rhythmo band</title>
  <desc id="d">The line's words scroll past a red mark. Each word is placed over the stretch of the original where it is spoken and stretched or squeezed to that length. The pause between the two sentences has no words in it.</desc>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-weight: 700; font-size: 20px; fill: #121821; }
    .sub { font-size: 14px; fill: #566173; }
    .w { font-weight: 800; font-size: 30px; fill: #121821; }
    .past { fill: #8a94a3; }
    .now { fill: #d42a36; }
    .note { font-size: 13.5px; fill: #121821; }
    .lab { font-weight: 700; font-size: 12px; letter-spacing: 0.08em; fill: #566173; }
  </style>
  <rect x="0" y="0" width="960" height="360" rx="18" fill="#ffffff" stroke="#d2d9e1"/>
  <text class="f h" x="28" y="42">The rhythmo band</text>
  <text class="f sub" x="28" y="64">The line’s words scroll past the red mark as they should be spoken. Say each word as it reaches the mark.</text>

  <!-- the band -->
  <rect x="28" y="86" width="904" height="78" rx="12" fill="#e2e7ec"/>
  <rect x="402" y="92" width="118" height="66" fill="url(#hatch)" opacity="0.9"/>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#edf0f3"/><line x1="0" y1="0" x2="0" y2="10" stroke="#d2d9e1" stroke-width="4"/>
    </pattern>
  </defs>
  <g class="f">
    <text class="w past" x="60" y="137" textLength="66" lengthAdjust="spacingAndGlyphs">Wi-Fi</text>
    <text class="w past" x="132" y="137" textLength="56" lengthAdjust="spacingAndGlyphs">has</text>
    <text class="w now" x="194" y="137" textLength="68" lengthAdjust="spacingAndGlyphs">been</text>
    <text class="w" x="268" y="137" textLength="128" lengthAdjust="spacingAndGlyphs">reset.</text>
    <text class="w" x="524" y="137" textLength="74" lengthAdjust="spacingAndGlyphs">Follow</text>
    <text class="w" x="604" y="137" textLength="40" lengthAdjust="spacingAndGlyphs">the</text>
    <text class="w" x="650" y="137" textLength="150" lengthAdjust="spacingAndGlyphs">instructions</text>
    <text class="w" x="806" y="137" textLength="22" lengthAdjust="spacingAndGlyphs">in</text>
    <text class="w" x="834" y="137" textLength="40" lengthAdjust="spacingAndGlyphs">the</text>
    <text class="w" x="880" y="137" textLength="44" lengthAdjust="spacingAndGlyphs">app</text>
  </g>
  <g fill="#8a94a3" opacity="0.6">
    <rect x="60" y="150" width="66" height="4" rx="2"/><rect x="132" y="150" width="56" height="4" rx="2"/><rect x="194" y="150" width="68" height="4" rx="2" fill="#d42a36"/><rect x="268" y="150" width="128" height="4" rx="2"/>
    <rect x="524" y="150" width="74" height="4" rx="2"/><rect x="604" y="150" width="40" height="4" rx="2"/><rect x="650" y="150" width="150" height="4" rx="2"/><rect x="806" y="150" width="22" height="4" rx="2"/><rect x="834" y="150" width="40" height="4" rx="2"/><rect x="880" y="150" width="44" height="4" rx="2"/>
  </g>
  <line x1="226" y1="80" x2="226" y2="250" stroke="#d42a36" stroke-width="3"/>
  <text class="f" x="226" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d42a36">now</text>

  <!-- the original's voice -->
  <text class="f lab" x="28" y="186">ORIGINAL</text>
  <rect x="28" y="194" width="904" height="52" rx="10" fill="#e2e7ec"/>
  <path d="M60 220 C 80 200, 100 240, 120 210 S 160 238, 180 206 S 220 236, 240 212 S 280 234, 300 208 S 340 230, 360 214 S 384 226, 396 220
           M524 220 C 540 202, 560 240, 580 208 S 620 238, 640 204 S 680 236, 700 212 S 740 232, 760 206 S 800 236, 820 210 S 860 230, 880 214 S 914 224, 924 220"
        fill="none" stroke="#22708f" stroke-width="3"/>
  <path d="M60 220 H396 M524 220 H924" stroke="#22708f" stroke-width="1" opacity="0.4"/>
  <path d="M402 220 H520" stroke="#9aa5b4" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- notes -->
  <g class="f note">
    <path d="M461 252 v28" stroke="#566173" stroke-width="1.5"/>
    <text x="461" y="298" text-anchor="middle" font-weight="700">The pause stays empty</text>
    <circle cx="36" cy="322" r="4" fill="#121821"/><text x="48" y="327">Each word sits over the time it’s spoken, stretched or squeezed to fit, so you can see how long to hold it.</text>
    <circle cx="36" cy="345" r="4" fill="#121821"/><text x="48" y="350">Words fill the stretches where the original speaks, with breaks at full stops and commas where possible.</text>
  </g>
</svg>
