<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">How transcription picks a speech model</title>
  <desc id="d">With "Best for this device and language", English cues use Moonshine Base. Other languages use Whisper Base on a computer and Whisper Tiny on an iPhone or iPad. If a model won't load or runs out of memory, the next one takes over.</desc>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-weight: 700; font-size: 20px; fill: #121821; }
    .sub { font-size: 14px; fill: #566173; }
    .box { fill: #ffffff; stroke: #d2d9e1; stroke-width: 1.5; }
    .bt { font-weight: 700; font-size: 15px; fill: #121821; }
    .bs { font-size: 12.5px; fill: #566173; }
    .q { fill: #edf0f3; stroke: #9aa5b4; stroke-width: 1.5; }
    .qt { font-weight: 700; font-size: 14px; fill: #121821; }
    .arr { fill: none; stroke: #566173; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .lbl { font-weight: 700; font-size: 12.5px; fill: #566173; }
    .fall { fill: none; stroke: #b25d05; stroke-width: 2; stroke-dasharray: 6 5; }
  </style>
  <rect x="0" y="0" width="960" height="400" rx="18" fill="#ffffff" stroke="#d2d9e1"/>
  <text class="f h" x="28" y="42">Transcription: which speech model runs</text>
  <text class="f sub" x="28" y="64">With “Best for this device and language”. It all runs on the device; each model downloads once.</text>

  <rect class="box" x="22" y="160" width="166" height="62" rx="12"/>
  <text class="f bt" x="105" y="188" text-anchor="middle">Selected cues</text>
  <text class="f bs" x="105" y="207" text-anchor="middle">chosen on the Script page</text>
  <path class="arr" d="M188 191 h24 m-7 -7 l7 7 l-7 7"/>

  <polygon class="q" points="290,140 368,191 290,242 212,191"/>
  <text class="f qt" x="290" y="187" text-anchor="middle">Language</text>
  <text class="f qt" x="290" y="204" text-anchor="middle">English?</text>

  <path class="arr" d="M290 140 V110 H430 m-7 -7 l7 7 l-7 7"/>
  <text class="f lbl" x="300" y="102">yes</text>
  <rect class="box" x="432" y="80" width="230" height="62" rx="12" stroke="#1c7d45"/>
  <text class="f bt" x="547" y="106" text-anchor="middle">Moonshine Base</text>
  <text class="f bs" x="547" y="125" text-anchor="middle">English only · light on memory</text>

  <path class="arr" d="M368 191 H430 m-7 -7 l7 7 l-7 7"/>
  <text class="f lbl" x="380" y="183">no</text>
  <polygon class="q" points="510,140 588,191 510,242 432,191"/>
  <text class="f qt" x="510" y="187" text-anchor="middle">iPhone or</text>
  <text class="f qt" x="510" y="204" text-anchor="middle">iPad?</text>

  <path class="arr" d="M588 191 H700 m-7 -7 l7 7 l-7 7"/>
  <text class="f lbl" x="600" y="183">yes</text>
  <rect class="box" x="702" y="160" width="230" height="62" rx="12"/>
  <text class="f bt" x="817" y="186" text-anchor="middle">Whisper Tiny</text>
  <text class="f bs" x="817" y="205" text-anchor="middle">99 languages · least memory</text>

  <path class="arr" d="M510 242 V272 H700 m-7 -7 l7 7 l-7 7"/>
  <text class="f lbl" x="520" y="264">no</text>
  <rect class="box" x="702" y="242" width="230" height="62" rx="12"/>
  <text class="f bt" x="817" y="268" text-anchor="middle">Whisper Base</text>
  <text class="f bs" x="817" y="287" text-anchor="middle">99 languages · needs about 1 GB</text>

  <path class="fall" d="M662 111 H817 V156"/>
  <text class="f bs" x="676" y="100" fill="#b25d05">won’t load? → next model</text>
  <path class="fall" d="M932 273 h10 v-82 h-10"/>

  <g class="f bs">
    <text x="28" y="338" fill="#121821" font-weight="700">Along the way</text>
    <text x="28" y="360">• Each finished cue is saved at once and unselected; after a stop or a crash the selection shows what’s left.</text>
    <text x="28" y="380">• A typed or imported line is kept; a line from an earlier transcription is replaced. The log on the Script page survives crashes.</text>
  </g>
</svg>
